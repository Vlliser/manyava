<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .confetti {
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <button id="celebrate">Celebrate!</button>
    <div class="confetti" id="confetti-container"></div>

    <script>
        function spawnConfetti() {
            const colors = ["#FF0D00", "#FFB600", "#A8E0A2", "#00B0FF", "#A452D1"];
            const container = document.getElementById('confetti-container');
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.position = 'absolute';
                confetti.style.width = Math.random() * 10 + 'px';
                confetti.style.height = Math.random() * 10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.animationDuration = Math.random() * 2 + 1 + 's';
                confetti.style.opacity = Math.random();
                container.appendChild(confetti);
            }
        }

        document.getElementById('celebrate').addEventListener('click', function() {
            spawnConfetti();
        });
    </script>
</body>
</html>
