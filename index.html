<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffeef8;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff69b4;
        }
        .heart {
            color: red;
            font-size: 50px;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
            .heart {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <p>Sending you lots of love on this special day! ❤️</p>
    <div class="heart">💖💕</div>
</body>
</html>
